<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Watch-Along Dual Lineups & Match HUD</title>
  
  <!-- Modern Sports Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="obs-transparent">

  <!-- Streamer Match Control Bar (Can be hidden during live stream) -->
  <header class="controller-hub" id="controllerHub">
    <!-- Home Team Select & Score -->
    <div class="control-unit">
      <label for="homeTeamSelect">Home Team</label>
      <select id="homeTeamSelect" aria-label="Select Home Team"></select>
      <div class="score-stepper">
        <button type="button" id="homeScoreMinus" aria-label="Decrease Home Score">-</button>
        <span class="stepper-val" id="ctrlHomeScore">0</span>
        <button type="button" id="homeScorePlus" aria-label="Increase Home Score">+</button>
      </div>
    </div>

    <!-- Central Match Timer Control -->
    <div class="timer-control-unit">
      <div class="timer-inputs">
        <input type="number" id="manualMin" min="0" max="130" value="0" aria-label="Minutes">
        <span>:</span>
        <input type="number" id="manualSec" min="0" max="59" value="00" aria-label="Seconds">
      </div>
      <div class="timer-buttons">
        <button type="button" id="timerStartBtn" class="btn-action">Start</button>
        <button type="button" id="timerResetBtn" class="btn-action btn-secondary">Reset</button>
      </div>
    </div>

    <!-- Away Team Select & Score -->
    <div class="control-unit">
      <label for="awayTeamSelect">Away Team</label>
      <select id="awayTeamSelect" aria-label="Select Away Team"></select>
      <div class="score-stepper">
        <button type="button" id="awayScoreMinus" aria-label="Decrease Away Score">-</button>
        <span class="stepper-val" id="ctrlAwayScore">0</span>
        <button type="button" id="awayScorePlus" aria-label="Increase Away Score">+</button>
      </div>
    </div>

    <button type="button" id="toggleHudBtn" class="btn-toggle">Hide Controls</button>
  </header>

  <!-- Live Broadcast HUD Header (Visible to Viewers) -->
  <section class="live-scoreboard-bar">
    <div class="sb-team sb-home">
      <span class="sb-badge" id="hudHomeBadge">ARS</span>
      <span class="sb-name" id="hudHomeName">Arsenal</span>
      <span class="sb-score" id="hudHomeScore">0</span>
    </div>

    <div class="sb-clock-center">
      <div class="clock-display" id="hudClock">00:00</div>
      <div class="match-status-badge" id="hudMatchHalf">1ST HALF</div>
    </div>

    <div class="sb-team sb-away">
      <span class="sb-score" id="hudAwayScore">0</span>
      <span class="sb-name" id="hudAwayName">Chelsea</span>
      <span class="sb-badge" id="hudAwayBadge">CHE</span>
    </div>
  </section>

  <!-- Dual Tactical Pitch Stage -->
  <main class="arena-grid">
    <!-- Home Team Tactical Pitch -->
    <article class="tactical-card" id="homeCard">
      <div class="card-meta">
        <div class="card-meta-title">
          <span class="meta-badge" id="cardHomeBadge">ARS</span>
          <span class="meta-name" id="cardHomeName">Arsenal</span>
        </div>
        <span class="meta-formation" id="cardHomeFormation">4-2-3-1</span>
      </div>
      <div class="tactical-pitch" id="homePitchSurface">
        <!-- Injected via lineup.js -->
      </div>
    </article>

    <!-- Away Team Tactical Pitch -->
    <article class="tactical-card" id="awayCard">
      <div class="card-meta">
        <div class="card-meta-title">
          <span class="meta-badge" id="cardAwayBadge">CHE</span>
          <span class="meta-name" id="cardAwayName">Chelsea</span>
        </div>
        <span class="meta-formation" id="cardAwayFormation">3-4-2-1</span>
      </div>
      <div class="tactical-pitch" id="awayPitchSurface">
        <!-- Injected via lineup.js -->
      </div>
    </article>
  </main>

  <script src="assets/js/lineup.js"></script>
</body>
</html>
