<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch-Along Live Broadcast Overlay</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="obs-transparent-layer">

  <!-- Streamer Operational Dashboard (Safe Interactive Layer) -->
  <header class="streamer-dashboard" id="streamerDashboard">
    <!-- Home Team -->
    <div class="dash-block">
      <label for="homeSelect">Home</label>
      <select id="homeSelect" class="obs-interactive-select" aria-label="Home Team Select"></select>
      <div class="score-adjust">
        <button type="button" id="btnHomeScoreSub">-</button>
        <span id="ctrlHomeScore">0</span>
        <button type="button" id="btnHomeScoreAdd">+</button>
      </div>
    </div>

    <!-- Match Clock Editor -->
    <div class="dash-block timer-hub">
      <input type="number" id="inputClockMin" min="0" max="130" value="0" aria-label="Minutes">
      <span>:</span>
      <input type="number" id="inputClockSec" min="0" max="59" value="00" aria-label="Seconds">
      <button type="button" id="btnClockToggle" class="btn-primary">Start</button>
      <button type="button" id="btnClockReset" class="btn-secondary">Reset</button>
    </div>

    <!-- Away Team -->
    <div class="dash-block">
      <label for="awaySelect">Away</label>
      <select id="awaySelect" class="obs-interactive-select" aria-label="Away Team Select"></select>
      <div class="score-adjust">
        <button type="button" id="btnAwayScoreSub">-</button>
        <span id="ctrlAwayScore">0</span>
        <button type="button" id="btnAwayScoreAdd">+</button>
      </div>
    </div>

    <!-- Utility Toggles -->
    <div class="dash-block actions-hub">
      <button type="button" id="btnAutoSwitchToggle" class="btn-toggle active">Auto: ON (10s)</button>
      <button type="button" id="btnHideControlBar" class="btn-toggle">Hide Controls</button>
    </div>
  </header>

  <!-- Broadcast Stage Layout (Explicitly isolated to prevent click hijacking) -->
  <main class="broadcast-viewport" id="broadcastViewport">
    
    <!-- LEFT SIDE: Streamer Facecam / Virtual Studio Area (100% Transparent, Click-Through) -->
    <section class="streamer-cam-zone" aria-label="Streamer Cam Space"></section>

    <!-- RIGHT SIDE: Tactical Lineup Frame -->
    <aside class="tactical-hud-zone" aria-label="Tactical Lineup Frame">
      <div class="lineup-frame-card">
        <div class="frame-header">
          <div class="team-title-wrap">
            <div class="logo-box">
              <img id="displayTeamLogo" src="assets/images/clubs/ars.png" alt="Club Logo" class="team-club-logo">
            </div>
            <div>
              <h2 class="team-heading" id="displayTeamName">Arsenal</h2>
              <span class="team-side-indicator" id="displayTeamStatus">HOME LINEUP</span>
            </div>
          </div>
          <div class="formation-badge" id="displayFormation">4-2-3-1</div>
        </div>

        <div class="pitch-container" id="pitchSurface">
          <!-- Injected via lineup.js -->
        </div>
      </div>
    </aside>

  </main>

  <!-- BOTTOM CENTER: Live Match Goals & Minutes HUD -->
  <footer class="bottom-scoreboard-center" id="liveScoreboardHud">
    <div class="score-team-cell home-cell">
      <img id="hudHomeLogo" src="assets/images/clubs/ars.png" alt="Home Logo" class="hud-mini-logo">
      <span class="hud-team-name" id="hudHomeName">Arsenal</span>
      <span class="hud-goal-number" id="hudHomeGoals">0</span>
    </div>

    <div class="score-clock-cell">
      <div class="hud-time-val" id="hudMatchClock">00:00</div>
      <div class="hud-period" id="hudMatchPeriod">1ST HALF</div>
    </div>

    <div class="score-team-cell away-cell">
      <span class="hud-goal-number" id="hudAwayGoals">0</span>
      <span class="hud-team-name" id="hudAwayName">Chelsea</span>
      <img id="hudAwayLogo" src="assets/images/clubs/che.png" alt="Away Logo" class="hud-mini-logo">
    </div>
  </footer>

  <script src="assets/js/lineup.js"></script>
</body>
</html>
