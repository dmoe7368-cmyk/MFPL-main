<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1050" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Line Glow Filter for Broadcast Quality -->
    <filter id="pitchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shared Line Stroke Settings -->
    <style>
      .pitch-line {
        stroke: rgba(255, 255, 255, 0.22);
        stroke-width: 3.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pitch-spot {
        fill: rgba(255, 255, 255, 0.35);
      }
      .corner-arc {
        stroke: rgba(255, 255, 255, 0.22);
        stroke-width: 3.5;
        fill: none;
      }
    </style>
  </defs>

  <g filter="url(#pitchGlow)">
    <!-- Outer Boundary Touchlines & Goal Lines -->
    <rect class="pitch-line" x="25" y="25" width="630" height="1000" rx="8" />

    <!-- Halfway Line -->
    <line class="pitch-line" x1="25" y1="525" x2="655" y2="525" />

    <!-- Center Circle & Center Spot -->
    <circle class="pitch-line" cx="340" cy="525" r="91.5" />
    <circle class="pitch-spot" cx="340" cy="525" r="4.5" />

    <!-- ================= TOP HALF (AWAY / DEFENSIVE ZONE) ================= -->
    <!-- Penalty Box (18-Yard Box) -->
    <rect class="pitch-line" x="139" y="25" width="402" height="165" />

    <!-- Goal Area (6-Yard Box) -->
    <rect class="pitch-line" x="227" y="25" width="226" height="55" />

    <!-- Goal Frame Outline -->
    <rect class="pitch-line" x="278" y="10" width="124" height="15" stroke-dasharray="4,4" opacity="0.6" />

    <!-- Penalty Spot -->
    <circle class="pitch-spot" cx="340" cy="135" r="4.5" />

    <!-- Penalty Arc (D-Box Arc) -->
    <path class="pitch-line" d="M 272 190 A 91.5 91.5 0 0 0 408 190" />

    <!-- Top Corner Arcs (Radius: 20) -->
    <path class="corner-arc" d="M 25 45 A 20 20 0 0 0 45 25" />
    <path class="corner-arc" d="M 635 25 A 20 20 0 0 0 655 45" />

    <!-- ================= BOTTOM HALF (HOME / ATTACKING ZONE) ================= -->
    <!-- Penalty Box (18-Yard Box) -->
    <rect class="pitch-line" x="139" y="860" width="402" height="165" />

    <!-- Goal Area (6-Yard Box) -->
    <rect class="pitch-line" x="227" y="970" width="226" height="55" />

    <!-- Goal Frame Outline -->
    <rect class="pitch-line" x="278" y="1025" width="124" height="15" stroke-dasharray="4,4" opacity="0.6" />

    <!-- Penalty Spot -->
    <circle class="pitch-spot" cx="340" cy="915" r="4.5" />

    <!-- Penalty Arc (D-Box Arc) -->
    <path class="pitch-line" d="M 272 860 A 91.5 91.5 0 0 1 408 860" />

    <!-- Bottom Corner Arcs (Radius: 20) -->
    <path class="corner-arc" d="M 45 1025 A 20 20 0 0 0 25 1005" />
    <path class="corner-arc" d="M 655 1005 A 20 20 0 0 0 635 1025" />
  </g>
</svg>
